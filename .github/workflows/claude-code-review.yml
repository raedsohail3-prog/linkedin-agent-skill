name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Secrets are not available to workflows triggered from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. This repository is a set of Claude skills
            (SKILL.md files under skills/) for LinkedIn work, plus templates and
            plugin/MCP configuration. Focus on:

            1. Security: leaked secrets or tokens, unsafe shell or workflow usage,
               and prompt-injection risks in skill instructions.
            2. Correctness: skill instructions that are contradictory, ambiguous,
               reference missing files/tools, or would make the agent act without
               user confirmation (e.g. publishing posts or sending DMs).
            3. Consistency with the other skills and the README.

            Use inline comments for specific issues and one top-level comment
            summarizing the review. If nothing significant is found, say so briefly.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
