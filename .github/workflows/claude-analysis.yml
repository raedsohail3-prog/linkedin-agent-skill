name: Claude Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: claude-analysis-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-analysis:
    runs-on: ubuntu-latest
    # Secrets are not exposed to workflows triggered from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect PR diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff "$BASE_SHA" "$HEAD_SHA" > pr.diff
          echo "Diff size: $(wc -c < pr.diff) bytes"

      - name: Ask Claude to review the diff
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          if [ -z "$CLAUDE_API_KEY" ]; then
            echo "::error::Repository secret CLAUDE_API_KEY is not set."
            exit 1
          fi

          if [ ! -s pr.diff ]; then
            echo "No changes to analyze." > review.md
            exit 0
          fi

          # Don't silently truncate: skip and say so if the diff is very large.
          if [ "$(wc -c < pr.diff)" -gt 600000 ]; then
            echo "Diff is larger than 600 KB; skipping automated Claude analysis." > review.md
            exit 0
          fi

          jq -n --rawfile diff pr.diff '{
            model: "claude-opus-5-5",
            max_tokens: 16000,
            fallbacks: "default",
            output_config: { effort: "high" },
            system: "You are a careful code reviewer. Review the pull request diff for security issues (leaked secrets, injection, unsafe shell or workflow usage, prompt-injection risks in agent instructions) and clear correctness bugs. Report concrete findings with file and line, ranked by severity. If there is nothing significant, say so briefly. Respond in GitHub-flavored Markdown.",
            messages: [{
              role: "user",
              content: ("Review this pull request diff:\n\n<diff>\n" + $diff + "\n</diff>")
            }]
          }' > request.json

          http_code=$(curl -sS -o response.json -w '%{http_code}' \
            https://api.anthropic.com/v1/messages \
            -H "content-type: application/json" \
            -H "x-api-key: $CLAUDE_API_KEY" \
            -H "anthropic-version: 2023-06-01" \
            -H "anthropic-beta: server-side-fallback-2026-07-01" \
            --data @request.json)

          if [ "$http_code" != "200" ]; then
            echo "::error::Claude API returned HTTP $http_code"
            jq . response.json || cat response.json
            exit 1
          fi

          stop_reason=$(jq -r '.stop_reason' response.json)
          if [ "$stop_reason" = "refusal" ]; then
            echo "Claude declined to analyze this diff ($(jq -r '.stop_details.category // "unspecified"' response.json))." > review.md
            exit 0
          fi

          jq -r '.content[] | select(.type == "text") | .text' response.json > review.md
          if [ "$stop_reason" = "max_tokens" ]; then
            printf '\n\n_Review was cut off at the output limit._\n' >> review.md
          fi

      - name: Post review comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## Claude analysis"
            echo
            cat review.md
          } > comment.md
          gh pr comment "$PR_NUMBER" --body-file comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
